# Routing manifest for rules/**. Mirrors each rule file's frontmatter —
# see _meta/frontmatter-schema.md and schemas/index-entry.schema.json.
# See RULES.md for the precedence system these rules sit within.

rules:
  - id: rule.anti-hallucination
    path: rules/anti-hallucination.md
    title: Anti-Hallucination Rules
    category: rule
    triggers: [verify before referencing, does this api exist, invented method, made up class]
    tech_tags: []
    severity: blocking

  - id: rule.definition-of-done
    path: rules/definition-of-done.md
    title: Definition of Done
    category: rule
    triggers: [is this done, definition of done, completion checklist, ready to merge]
    tech_tags: []
    severity: blocking

  - id: rule.general
    path: rules/general.md
    title: General Rules
    category: rule
    triggers: [general rules, cross cutting rules, smallest change, avoid refactoring]
    tech_tags: []
    severity: blocking

  - id: rule.csharp
    path: rules/csharp.md
    title: C# Rules
    category: rule
    triggers: [c# rules, nullable reference types, async rules, cancellation token rule]
    tech_tags: [csharp]
    severity: blocking

  - id: rule.dotnet
    path: rules/dotnet.md
    title: .NET Runtime Rules
    category: rule
    triggers: [dotnet rules, di lifetime rule, httpclientfactory rule, configuration rule]
    tech_tags: [dotnet, aspnetcore]
    severity: blocking

  - id: rule.architecture
    path: rules/architecture.md
    title: Architecture Rules
    category: rule
    triggers: [architecture rules, dependency direction rule, simplest architecture, module boundary rule]
    tech_tags: [dotnet]
