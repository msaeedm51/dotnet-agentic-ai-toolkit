    tech_tags: [aspnetcore, rest]
    severity: blocking

  - id: rule.database
    path: rules/database.md
    title: Database Rules
    category: rule
    triggers: [database rules, migration rule, index rule, query rule]
    tech_tags: [sql, efcore, sqlserver, postgresql]
    severity: blocking

  - id: rule.security
    path: rules/security.md
    title: Security Rules
    category: rule
    triggers: [security rules, owasp rules, secrets rule, least privilege rule]
    tech_tags: [aspnetcore, dotnet]
    severity: blocking

  - id: rule.testing
    path: rules/testing.md
